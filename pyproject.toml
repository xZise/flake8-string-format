[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "flake8-string-format"
dynamic = ["version"]
description = "string format checker, plugin for flake8"
readme = "README.rst"
license = "MIT"
keywords = ["flake8", "format"]
maintainers = [
    { name = "Fabian Neundorf", email = "CommodoreFabianus@gmx.de" }
]
requires-python = ">=3.8"
dependencies = ["flake8"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Flake8",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/xZise/flake8-string-format"

[project.optional-dependencies]
test = ["six"]

[project.entry-points."flake8.extension"]
FMT = "flake8_string_format:StringFormatChecker"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["flake8_string_format.py"]
